name: Java CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Java 17 is the project baseline; Java 21 checks compatibility with a newer LTS runtime.
      matrix:
        java: ['17', '21']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Browser tests (*PageIT) drive headless Chromium through Playwright.
      - name: Install Playwright Chromium
        run: >-
          mvn --batch-mode --quiet test-compile exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"

      - name: Run tests
        run: mvn --batch-mode verify
